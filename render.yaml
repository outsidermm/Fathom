# Render Blueprint — provisions the API service and its database in one shot.
#
# Setup (one-time, in the Render dashboard):
#   1. New > Blueprint > connect this GitHub repo. Render reads this file
#      and shows both resources below for approval.
#   2. After the first deploy, set these on the `observatory-api` service
#      (Environment tab) — they're marked `sync: false` below because
#      they're secrets / not known until James's Runpod bridge exists:
#        QWEN_API_BASE   — the reachable URL for the Qwen bridge
#        QWEN_API_KEY    — bearer token for it, if the bridge requires one
#        CORS_ORIGINS    — the Vercel deployment URL(s), comma-separated
#   3. See docs/deployment.md for the full walkthrough and the Vercel side.
#
# QWEN_MODEL and DATABASE_URL are wired below and need no manual step.

databases:
  - name: observatory-db
    plan: basic-256mb
    databaseName: observatory
    user: observatory

services:
  - type: web
    name: observatory-api
    runtime: docker
    plan: starter
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: ./apps/api
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: observatory-db
          property: connectionString
      - key: QWEN_MODEL
        value: qwen2.5-7b
      - key: QWEN_API_BASE
        sync: false
      - key: QWEN_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
